# ADO gate (step template) for Azure Repos PR validation builds. Posts the result on the PR.
# Advisory: the step fails ONLY when `ado gate` exits 1 and gate.json says blocking: true, or the story-id step finds an invalid ado.config.json (`ado branch --id-from` exit 3).
#   - template: pipelines/ado-gate.yml@spec-kit-ado
# The story id comes from the source branch name by the `ado branch --id-from` rule
# (<branch_prefix>ab<id>-<slug>, or AB#<id>; branch_prefix comes from ado.config.json).
parameters:
  - name: configPath
    type: string
    default: ado.config.json
  - name: repoPath
    type: string
    default: repo   # where `self` is checked out, relative to $(Agent.BuildDirectory)

steps:
  - checkout: self
    path: ${{ parameters.repoPath }}
    fetchDepth: 0
    persistCredentials: false
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - checkout: spec-kit-ado
    path: spec-kit-ado-toolkit
    persistCredentials: false
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - script: pip install --quiet $(Agent.BuildDirectory)/spec-kit-ado-toolkit
    displayName: Install spec-kit-ado toolkit
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - script: |
      : "${AGENT_TEMPDIRECTORY:?AGENT_TEMPDIRECTORY is not set - refusing to write scratch files into the checkout}"
      # Annotation text from untrusted data (CLI stderr, branch names): one line, no control chars, UTF-8-safe 300-char cut ('#' -> '# ' so no ##vso command can form)
      ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t.replace("#","# ")[:300].encode())'; }
      branch=${SOURCE_BRANCH#refs/heads/}
      code=0
      id=$(ado branch --id-from="$branch" 2> "$AGENT_TEMPDIRECTORY/id.err") || code=$?
      if [ "$code" -eq 3 ]; then  # invalid ado.config.json: fail closed (a missing config, exit 2, stays advisory)
        # No PR thread: `ado pr comment` loads the same invalid config, so it could not post one.
        echo "##vso[task.logissue type=error]ADO gate FAILED: ado.config.json is invalid — $(head -n 1 "$AGENT_TEMPDIRECTORY/id.err" | ann)"
        exit 1
      fi
      if [ "$code" -eq 1 ]; then
        echo "##vso[task.logissue type=warning]No work item id in the source branch - ADO gate skipped (advisory)."
        exit 0
      fi
      if [ "$code" -ne 0 ]; then
        echo "##vso[task.logissue type=warning]Could not read the story id from the branch (ado exit $code) - ADO gate skipped (advisory): $(ann < "$AGENT_TEMPDIRECTORY/id.err")"
        exit 0
      fi
      # File names go through a NUL-delimited file + mapfile, never into the script text.
      code=0; rm -f "$AGENT_TEMPDIRECTORY/gate.md" "$AGENT_TEMPDIRECTORY/gate.err"  # a stale file must never become the comment
      if git diff -z --name-only "origin/${TARGET_BRANCH#refs/heads/}...HEAD" > "$AGENT_TEMPDIRECTORY/changed.bin"; then
        mapfile -d '' changed < "$AGENT_TEMPDIRECTORY/changed.bin"
        changed=("${changed[@]/#/./}")  # ./ prefix: a name like -x or --offline must not parse as an option
        ado gate "$id" --src . --base "origin/${TARGET_BRANCH#refs/heads/}" --summary-out "$AGENT_TEMPDIRECTORY/gate.md" --changed "${changed[@]}" > "$AGENT_TEMPDIRECTORY/gate.json" 2> "$AGENT_TEMPDIRECTORY/gate.err" || code=$?
      else code=2; fi
      if [ -s "$AGENT_TEMPDIRECTORY/gate.err" ]; then echo "ado gate: $(ann < "$AGENT_TEMPDIRECTORY/gate.err")"; fi  # CLI stderr can carry config/ADO text
      [ -s "$AGENT_TEMPDIRECTORY/gate.md" ] || echo "ADO gate could not run (see job log)." > "$AGENT_TEMPDIRECTORY/gate.md"
      ado pr comment "$PR_ID" --body-file "$AGENT_TEMPDIRECTORY/gate.md" > /dev/null 2> "$AGENT_TEMPDIRECTORY/pr.err" \
        || echo "##vso[task.logissue type=warning]Could not post the PR comment (the build identity needs Contribute to pull requests): $(ann < "$AGENT_TEMPDIRECTORY/pr.err")"
      [ "$code" -eq 0 ] || { [ "$code" -eq 1 ] && python3 -I -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))["blocking"] is True else 1)' "$AGENT_TEMPDIRECTORY/gate.json" 2>/dev/null; } || echo "##vso[task.logissue type=warning]spec-kit-ado gate could not run (see the PR comment and job log)"
      # Fail ONLY when ado gate exits 1 AND gate.json says blocking: true; anything else is advisory.
      if [ "$code" -eq 1 ] && python3 -I -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))["blocking"] is True else 1)' "$AGENT_TEMPDIRECTORY/gate.json" 2>/dev/null; then exit 1; fi
    displayName: Run gate and post summary
    workingDirectory: $(Agent.BuildDirectory)/${{ parameters.repoPath }}
    condition: eq(variables['Build.Reason'], 'PullRequest')
    env:
      ADO_TOKEN: $(System.AccessToken)
      ADO_CONFIG: $(Agent.BuildDirectory)/${{ parameters.repoPath }}/${{ parameters.configPath }}
      SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
      TARGET_BRANCH: $(System.PullRequest.TargetBranch)
      PR_ID: $(System.PullRequest.PullRequestId)
