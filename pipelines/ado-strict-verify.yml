# ADO strict verify (step template, optional, secret-free) for Azure Repos PR validation builds.
# SHIPPED UNRUN (hosted agents are billing-blocked in this project): covered by structural pins, `bash -n` and real-bash tests with a fake `ado` only.
#   - template: pipelines/ado-strict-verify.yml@spec-kit-ado
# No token is mapped and persistCredentials is false. It re-runs `ado strict verify --no-record` (the red commit must fail, the green commit must pass) on the PR's code,
# so a hand-written record cannot satisfy it: it re-runs the tests at the recorded commits under the target branch's command; it fails while an `l2` or `test-command` override is in force
# unless `allowOverride` is set; it does not show a test is meaningful (the PR still writes the tests at those commits).
# SECURITY: it runs the project's test command on the PR's code: no secret to steal, but a hostile PR can still run arbitrary code on the agent. Use ephemeral agents.
# It does nothing unless the TARGET branch's ado.config.json says mode: strict: under any other target the test command would come from the PR.
# The story id comes from the source branch name by the `ado branch --id-from` rule, as for the gate.
parameters:
  - name: repoPath
    type: string
    default: repo   # where `self` is checked out, relative to $(Agent.BuildDirectory)
  - name: allowOverride
    type: boolean
    default: false   # true = accept an override in force (an `l2` or `test-command` override skips the run this job exists for)

steps:
  - checkout: self
    path: ${{ parameters.repoPath }}
    fetchDepth: 0
    persistCredentials: false
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - checkout: spec-kit-ado
    path: spec-kit-ado-toolkit
    persistCredentials: false
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - script: pip install --quiet $(Agent.BuildDirectory)/spec-kit-ado-toolkit
    displayName: Install spec-kit-ado toolkit
    condition: eq(variables['Build.Reason'], 'PullRequest')
  - script: |
      : "${AGENT_TEMPDIRECTORY:?AGENT_TEMPDIRECTORY is not set - refusing to write scratch files into the checkout}"
      : "${SOURCE_BRANCH:?SOURCE_BRANCH is not set - this job judges a pull request}"
      : "${TARGET_BRANCH:?TARGET_BRANCH is not set - this job judges a pull request against its target branch}"
      : "${HEAD_SHA:?HEAD_SHA is not set - this job judges the PR head commit}"
      # Annotation text from untrusted data (CLI stderr): one line, no control chars, UTF-8-safe 300-char cut ('#' -> '# ' so no ##vso command can form)
      ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t.replace("#","# ")[:300].encode())'; }
      branch=${SOURCE_BRANCH#refs/heads/}
      # The PR head commit (as the gate's --head), not the merge commit PR validation checks out: checked out before any ado call, or the job fails closed.
      if [ "${#HEAD_SHA}" -ne 40 ] || [ -n "$(printf '%s' "$HEAD_SHA" | tr -d '0-9a-f')" ]; then
        echo "##vso[task.logissue type=error]ADO strict verify FAILED: the PR head commit id is not a 40-character hex id"
        exit 1
      fi
      git checkout --quiet --detach "$HEAD_SHA" 2> /dev/null || {
        echo "##vso[task.logissue type=error]ADO strict verify FAILED: could not check out the PR head commit (use fetchDepth: 0)"
        exit 1
      }
      # Strict mode first: local and read-only. Only a strict config ON THE TARGET BRANCH lets the job go on.
      # Exit 3 = a config that cannot be trusted: fail closed. Exit 2 (no usable config) is advisory. Every other non-zero exit
      # (a crash, 127 = no ado, a signal) means the mode is unknown: fail closed too.
      rm -f "$AGENT_TEMPDIRECTORY/mode.json" "$AGENT_TEMPDIRECTORY/mode.err" "$AGENT_TEMPDIRECTORY/id.err" "$AGENT_TEMPDIRECTORY/verify.json" "$AGENT_TEMPDIRECTORY/verify.err"
      mcode=0
      ado strict mode --base "origin/${TARGET_BRANCH#refs/heads/}" > "$AGENT_TEMPDIRECTORY/mode.json" 2> "$AGENT_TEMPDIRECTORY/mode.err" || mcode=$?
      if [ "$mcode" -eq 3 ]; then
        echo "##vso[task.logissue type=error]ADO strict verify FAILED: ado.config.json is invalid — $(head -n 1 "$AGENT_TEMPDIRECTORY/mode.err" | ann)"
        exit 1
      fi
      if [ "$mcode" -ne 0 ] && [ "$mcode" -ne 2 ]; then
        echo "##vso[task.logissue type=error]ADO strict verify FAILED: could not determine the strict mode (ado strict mode exit $mcode) — $(head -n 1 "$AGENT_TEMPDIRECTORY/mode.err" | ann)"
        exit 1
      fi
      state="advisory pull request"
      [ "$mcode" -ne 0 ] || state=$(python3 -I -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["mode"],d["source"])' "$AGENT_TEMPDIRECTORY/mode.json" 2>/dev/null) || state=unreadable
      case "$state" in
        "strict target branch") ;;
        "strict pull request"|"advisory pull request")
          echo "spec-kit-ado strict verify skipped: the target branch's ado.config.json is not strict, so the project's test command is not run (it would come from the PR)."
          exit 0 ;;
        *)
          echo "##vso[task.logissue type=error]ADO strict verify FAILED: could not read the strict mode (unexpected output of ado strict mode)"
          exit 1 ;;
      esac
      code=0
      id=$(ado branch --id-from="$branch" --base "origin/${TARGET_BRANCH#refs/heads/}" 2> "$AGENT_TEMPDIRECTORY/id.err") || code=$?
      if [ "$code" -ne 0 ] || [ -z "$id" ]; then  # the re-run cannot be skipped under a strict target
        echo "##vso[task.logissue type=error]ADO strict verify FAILED: strict mode needs a work item id in the source branch name and none could be read (ado exit $code)"
        exit 1
      fi
      # The test command comes from the target branch's config; the runner clones the PR head into a scrubbed environment. Rule ids only in the log, never test output.
      vcode=0
      allow=; case "$ALLOW_OVERRIDE" in [Tt]rue) allow=--allow-override ;; esac  # allowOverride renders as True/False
      env -u ADO_TOKEN ado strict verify "$id" --no-record --base "origin/${TARGET_BRANCH#refs/heads/}" $allow > "$AGENT_TEMPDIRECTORY/verify.json" 2> "$AGENT_TEMPDIRECTORY/verify.err" || vcode=$?
      if [ -s "$AGENT_TEMPDIRECTORY/verify.err" ]; then echo "ado strict verify: $(ann < "$AGENT_TEMPDIRECTORY/verify.err")"; fi
      if [ "$vcode" -eq 0 ]; then echo "spec-kit-ado: strict verify passed."; exit 0; fi
      rules=$(python3 -I -c 'import json,re,sys;print(" ".join(re.sub("[^A-Za-z0-9_-]","",str(x["rule"]))[:40] for x in json.load(open(sys.argv[1]))["findings"][:20]))' "$AGENT_TEMPDIRECTORY/verify.json" 2>/dev/null) || rules=
      echo "##vso[task.logissue type=error]ADO strict verify FAILED (exit $vcode) - rule ids: ${rules:-none (the run could not complete, see the job log)}"
      exit 1
    displayName: Re-run the recorded red and green commits
    workingDirectory: $(Agent.BuildDirectory)/${{ parameters.repoPath }}
    condition: eq(variables['Build.Reason'], 'PullRequest')
    env:
      SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
      TARGET_BRANCH: $(System.PullRequest.TargetBranch)
      HEAD_SHA: $(System.PullRequest.SourceCommitId)
      ALLOW_OVERRIDE: ${{ parameters.allowOverride }}
