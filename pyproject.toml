[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-kit-ado"
version = "0.4.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Azure DevOps CLI for spec-kit-ado: work items, DoD ledger, gate, task push"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "praveenlavu"}]
keywords = ["azure-devops", "azure-boards", "spec-kit", "ai-agents", "human-in-the-loop", "tdd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/praveenlavu/spec-kit-ado"
Source = "https://github.com/praveenlavu/spec-kit-ado"
Issues = "https://github.com/praveenlavu/spec-kit-ado/issues"
Changelog = "https://github.com/praveenlavu/spec-kit-ado/blob/main/CHANGELOG.md"

[project.scripts]
ado = "ado.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ado = ["seeds/*.json", "golden/*.json"]
