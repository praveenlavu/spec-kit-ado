# Fixture for tests/test_speckit_contract.py (P4-15). It copies the SHAPE of the shipped ado-lifecycle workflow that the kit depends on, with no `ado` call:
# the shipped workflow id, input names (story_id and the 12 verdict_* inputs the poller resumes with) and shipped step ids, so `status.read_run` reads its
# state.json; a top-level gate (`review-spec`) and a gate inside a do-while loop (`approve-questions`), both with `verdict_input`. The shell step
# `questions-apply` is steered by marker files the test creates in the project directory: `fail-apply` makes it exit 2, `again` makes it print "again" on stderr
# once (the loop repeats). Not shipped, not installed.
schema_version: "1.0"
workflow:
  id: "ado-lifecycle"
  name: "Contract fixture"
  version: "0.0.1"
  author: "contoso"
  description: "Gate inside a loop, for the Spec Kit contract tests."
inputs:
  story_id:
    type: number
    required: true
  verdict_review_spec:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_questions:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_plan_questions:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_wait_po_answers:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_answers_questions:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_review_plan:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_push:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_decisions:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_sync:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_review_review:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_approve_pr:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
  verdict_wait_po_validation:
    type: string
    enum: ["", "approve", "reject"]
    default: ""
steps:
  - id: pull
    type: shell
    run: "echo pull >> trace.txt"

  - id: review-spec
    type: gate
    verdict_input: verdict_review_spec
    message: "First gate."
    options: [approve, reject]
    on_reject: abort

  - id: questions-loop
    type: do-while
    condition: "{{ steps.questions-apply.output.stderr | contains('again') }}"
    steps:
      - id: questions-preview
        type: shell
        run: "echo preview >> trace.txt"

      - id: approve-questions
        type: gate
        verdict_input: verdict_approve_questions
        message: "Gate inside a loop."
        options: [approve, reject]
        on_reject: abort

      - id: questions-apply
        type: shell
        run: |
          echo apply >> trace.txt
          if [ -e fail-apply ]; then echo boom >&2; exit 2; fi
          if [ -e again ]; then rm again; echo again >&2; fi

  - id: questions-applied
    type: shell
    run: "echo applied >> trace.txt"
