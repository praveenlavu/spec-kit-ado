name: ADO gate (reusable)
# Call from a consumer repo on pull_request, e.g.:
#   uses: praveenlavu/spec-kit-ado/.github/workflows/ado-gate.yml@v0
#   secrets: { ADO_TOKEN: ${{ secrets.ADO_TOKEN }} }
# Blocks the PR when `ado gate` exits 1 with blocking findings, or exits 3 (invalid ado.config.json); otherwise advisory.
# Strict (the target branch's ado.config.json says mode: strict, read by `ado strict mode`): a PR with no AB# reference fails instead of skipping the gate,
# `ado strict check --phase pr` runs after the gate (rule ids only in the comment) and fails the job; a mode that cannot be determined fails too.
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: "ado.config.json"
      toolkit-ref:
        description: "Ref of praveenlavu/spec-kit-ado to install"
        type: string
        default: "v0"
    secrets:
      ADO_TOKEN:
        required: true
      TOOLKIT_READ_TOKEN:
        description: "Needed only while the toolkit repo is private; falls back to github.token"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: praveenlavu/spec-kit-ado
          ref: ${{ inputs.toolkit-ref }}
          token: ${{ secrets.TOOLKIT_READ_TOKEN || github.token }}
          path: .ado-toolkit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolkit
        # Remove the checkout so `ado gate --src .` never scans the toolkit's own tests.
        run: pip install --quiet ./.ado-toolkit && rm -rf .ado-toolkit
      - name: Resolve strict mode
        # Local and read-only: no token is needed to learn the mode, so none is given. A strict config on the target branch decides.
        id: mode
        env:
          ADO_CONFIG: ${{ github.workspace }}/${{ inputs.config-path }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          # CLI stderr is one fixed line, but it is still annotation text: one line, no control chars, 300-char cut
          ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t[:300].encode())'; }
          rm -f "$RUNNER_TEMP/mode.json" "$RUNNER_TEMP/mode.err"
          code=0
          ado strict mode --base "origin/${BASE_REF}" > "$RUNNER_TEMP/mode.json" 2> "$RUNNER_TEMP/mode.err" || code=$?
          # Exit 3: the target's (or the PR's) config cannot be trusted: fail closed. Exit 2 (no usable config) stays advisory, as before.
          # Every other non-zero exit (a crash, 127 = no ado, a signal) means the mode is unknown: fail closed too, whatever the target says.
          if [ "$code" -eq 3 ]; then echo "::error::spec-kit-ado: ado.config.json is invalid or unreadable: $(ann < "$RUNNER_TEMP/mode.err")"; exit 3; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "::error::spec-kit-ado: could not determine the strict mode (ado strict mode exit $code): $(ann < "$RUNNER_TEMP/mode.err")"; exit 1; fi
          mode=advisory
          [ "$code" -ne 0 ] || mode=$(python3 -I -c 'import json,sys;print(json.load(open(sys.argv[1]))["mode"])' "$RUNNER_TEMP/mode.json" 2>/dev/null) || mode=unreadable
          if [ "$mode" != strict ] && [ "$mode" != advisory ]; then echo "::error::spec-kit-ado: could not read the strict mode (unexpected output of ado strict mode)"; exit 1; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Resolve story id (first AB#<n> in title/body)
        id: story
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          id=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -oE '(^|[^A-Za-z0-9])AB#[1-9][0-9]*' | grep -oE '[0-9]+$' | head -1 || true)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if [ -z "$id" ] && [ "$MODE" = strict ]; then echo "::error::spec-kit-ado strict mode: the PR title or body has no AB# reference, so the ADO gate cannot run and cannot be skipped."; exit 1; fi
          if [ -z "$id" ]; then echo "::notice::No AB# reference in PR title/body - ADO gate skipped (advisory)."; fi
      - name: Run gate
        # Holds the ADO token and reads the PR's files: it never sees GH_TOKEN (that is the next step's).
        if: steps.story.outputs.id != ''
        env:
          ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
          ADO_CONFIG: ${{ github.workspace }}/${{ inputs.config-path }}
          STORY_ID: ${{ steps.story.outputs.id }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          # CLI stderr can carry config/ADO text: one line, no control chars, 300-char cut
          ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t[:300].encode())'; }
          # File names go through a NUL-delimited file + mapfile, never into the script text.
          # Scratch files live in $RUNNER_TEMP, never in the PR checkout: a PR-committed symlink with one of these names must not be written through.
          code=0; rm -f "$RUNNER_TEMP/gate.md" "$RUNNER_TEMP/gate.err" "$RUNNER_TEMP/gate.code"  # a stale summary must never become the comment
          if git diff -z --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.bin"; then
            mapfile -d '' changed < "$RUNNER_TEMP/changed.bin"
            changed=("${changed[@]/#/./}")  # ./ prefix: a name like -x or --offline must not parse as an option
            ado gate "$STORY_ID" --src . --base "origin/${BASE_REF}" --summary-out "$RUNNER_TEMP/gate.md" --changed "${changed[@]}" > "$RUNNER_TEMP/gate.json" 2> "$RUNNER_TEMP/gate.err" || code=$?
          else code=2; fi
          if [ -s "$RUNNER_TEMP/gate.err" ]; then echo "ado gate: $(ann < "$RUNNER_TEMP/gate.err")"; fi
          [ -s "$RUNNER_TEMP/gate.md" ] || echo "ADO gate could not run (see job log)." > "$RUNNER_TEMP/gate.md"
          echo "$code" > "$RUNNER_TEMP/gate.code"  # the next step posts the summary and decides the verdict
      - name: Strict check
        # A local check of the PR's own files and git history: no ADO_TOKEN and no GH_TOKEN here. Rule ids reach the log and the comment, never the finding text.
        if: steps.story.outputs.id != '' && steps.mode.outputs.mode == 'strict'
        env:
          ADO_CONFIG: ${{ github.workspace }}/${{ inputs.config-path }}
          STORY_ID: ${{ steps.story.outputs.id }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t[:300].encode())'; }
          rm -f "$RUNNER_TEMP/strict.json" "$RUNNER_TEMP/strict.err" "$RUNNER_TEMP/strict.md" "$RUNNER_TEMP/strict.rules" "$RUNNER_TEMP/strict.code"  # a stale file must never be this run's verdict
          code=0
          ado strict check "$STORY_ID" --phase pr --head "$HEAD_SHA" --base "origin/${BASE_REF}" > "$RUNNER_TEMP/strict.json" 2> "$RUNNER_TEMP/strict.err" || code=$?
          if [ -s "$RUNNER_TEMP/strict.err" ]; then echo "ado strict check: $(ann < "$RUNNER_TEMP/strict.err")"; fi
          echo "$code" > "$RUNNER_TEMP/strict.code"  # the last step decides the verdict
          if [ "$code" -ne 0 ]; then
            rules=$(python3 -I -c 'import json,re,sys;print(" ".join(re.sub("[^A-Za-z0-9_-]","",str(x["rule"]))[:40] for x in json.load(open(sys.argv[1]))["findings"][:20]))' "$RUNNER_TEMP/strict.json" 2>/dev/null) || rules=
            echo "$rules" > "$RUNNER_TEMP/strict.rules"
            printf '\n**spec-kit-ado strict check failed** - rule ids: %s\n' "${rules:-none (the check could not run, see the job log)}" > "$RUNNER_TEMP/strict.md"
          fi
      - name: Post summary and enforce
        if: steps.story.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          code=$(cat "$RUNNER_TEMP/gate.code" 2>/dev/null) || code=2  # no verdict file: the gate step did not finish
          case "$code" in 0|1|2|3) ;; *) code=2;; esac
          # Edit only this workflow's own marked comment, never another bot's last comment.
          { echo '<!-- spec-kit-ado:gate -->'; cat "$RUNNER_TEMP/gate.md"; } > "$RUNNER_TEMP/comment.md"
          if [ "$MODE" = strict ] && [ -s "$RUNNER_TEMP/strict.md" ]; then cat "$RUNNER_TEMP/strict.md" >> "$RUNNER_TEMP/comment.md"; fi  # rule ids only
          cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUM/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- spec-kit-ado:gate -->"))) | .id' | tail -1) || cid=
          if [ -n "$cid" ] && gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null; then :
          else gh pr comment "$PR_NUM" --body-file "$RUNNER_TEMP/comment.md" || echo "::warning::Could not post PR comment."; fi
          # An invalid config is explicit misconfiguration: fail closed (a missing config/token stays advisory, exit 2).
          if [ "$code" -eq 3 ]; then echo "::error::spec-kit-ado: ado.config.json is invalid (see the PR comment and job log)"; exit 3; fi
          [ "$code" -eq 0 ] || { [ "$code" -eq 1 ] && python3 -I -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))["blocking"] is True else 1)' "$RUNNER_TEMP/gate.json" 2>/dev/null; } || echo "::warning::spec-kit-ado gate could not run (see the PR comment and job log)"
          # Fail ONLY when ado gate exits 1 AND gate.json says blocking: true; anything else is advisory.
          if [ "$code" -eq 1 ] && python3 -I -c 'import json,sys;sys.exit(0 if json.load(open(sys.argv[1]))["blocking"] is True else 1)' "$RUNNER_TEMP/gate.json" 2>/dev/null; then exit 1; fi
      - name: Enforce strict check
        # Last, so the comment above is posted whatever the verdict: a strict check that failed or never finished fails the job.
        if: steps.story.outputs.id != '' && steps.mode.outputs.mode == 'strict'
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          code=$(cat "$RUNNER_TEMP/strict.code" 2>/dev/null) || code=2  # no verdict file: the strict check did not finish
          [ "$code" = 0 ] || { echo "::error::spec-kit-ado: strict check failed - rule ids: $(cat "$RUNNER_TEMP/strict.rules" 2>/dev/null)"; exit 1; }
