name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: pip install --quiet ".[dev]"
      # Real-repo tests (tests/test_ci_speckit_repo.py) need the Spec Kit CLI; pinned by commit to upstream release v1.2.1
      # (9dca9bf42a031765ee5e5f2371137f2f26967e11), because tags can move. Bump on purpose, not by drift. With CI=true they fail rather than skip.
      - name: Install Spec Kit CLI (pinned)
        run: pip install --quiet "git+https://github.com/github/spec-kit.git@9dca9bf42a031765ee5e5f2371137f2f26967e11"
      - name: Run the test suite
        run: pytest -q

  scrub:
    runs-on: ubuntu-latest
    env:
      SCRUB_DENYLIST: ${{ secrets.SCRUB_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Fork PRs have no secrets, so the denylist may be empty there.
      - name: Scrub check (pull request)
        if: github.event_name == 'pull_request'
        run: python scripts/scrub_check.py
      - name: Scrub check (push to main - strict, full history)
        if: github.event_name == 'push'
        run: python scripts/scrub_check.py --require-denylist --history

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows (actionlint, pinned release)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
