name: ADO branch guard (reusable)
# Call from a consumer repo, e.g.:
#   uses: praveenlavu/spec-kit-ado/.github/workflows/ado-branch-guard.yml@v0
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        default: "ado.config.json"
      toolkit-ref:
        description: "Ref of praveenlavu/spec-kit-ado to install"
        type: string
        default: "v0"
    secrets:
      ADO_TOKEN:
        required: true
      TOOLKIT_READ_TOKEN:
        description: "Needed only while the toolkit repo is private; falls back to github.token"
        required: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: praveenlavu/spec-kit-ado
          ref: ${{ inputs.toolkit-ref }}
          token: ${{ secrets.TOOLKIT_READ_TOKEN || github.token }}
          path: .ado-toolkit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify the branch is tied to an existing work item
        env:
          ADO_TOKEN: ${{ secrets.ADO_TOKEN }}
          ADO_CONFIG: ${{ github.workspace }}/${{ inputs.config-path }}
          BRANCH: ${{ github.head_ref }}
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set - refusing to write scratch files into the checkout}"
          pip install --quiet ./.ado-toolkit && rm -rf .ado-toolkit
          # Annotation text from untrusted data (CLI stderr, branch names): one line, no control chars, UTF-8-safe 300-char cut
          ann() { python3 -I -c 'import re,sys;t=re.sub("[\x00-\x1f\x7f-\x9f\u2028\u2029]"," ",sys.stdin.buffer.read().decode("utf-8","replace"));sys.stdout.buffer.write(t[:300].encode())'; }
          # Same rule as `ado branch --id-from` (branch_prefix comes from ado.config.json):
          # <branch_prefix>ab<id>-<slug>, or AB#<id> anywhere. Exit 1 = no id, 2 = no usable config.
          code=0
          id=$(ado branch --id-from="$BRANCH" 2> "${RUNNER_TEMP}/id.err") || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::Branch '$(printf '%s' "$BRANCH" | ann)' is not tied to a work item (expected <branch_prefix>ab<id>-<slug>, e.g. feature/ab1001-thing, or AB#<id>)."
            exit 1
          fi
          if [ "$code" -ne 0 ]; then  # no config (2), invalid config (3; ado-gate fails on it, not this guard), ado missing (127), ...: advisory, never red
            echo "::warning::Could not read the story id from the branch (ado exit $code, branch not checked): $(ann < "${RUNNER_TEMP}/id.err")"
            exit 0
          fi
          code=0
          ado get "$id" > /dev/null 2> "${RUNNER_TEMP}/get.err" || code=$?
          if [ "$code" -eq 0 ]; then echo "Work item $id verified."; exit 0; fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::Missing config or token - work item not verified (advisory)."
            exit 0
          fi
          # Only a genuine not-found fails; any other error means ADO could not be checked.
          if grep -q 'HTTP 404' "${RUNNER_TEMP}/get.err"; then
            echo "::error::Work item $id (from the branch name) does not exist (HTTP 404) - check the id or the project in ado.config.json."
            exit 1
          fi
          echo "::warning::Work item $id could not be verified (ADO error, not a 404) - branch guard is advisory here."
