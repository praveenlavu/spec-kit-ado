<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">spec-kit-ado</title>
  <desc id="d">An AI agent works on an Azure DevOps story, you say yes at each step, and the story is done.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0f2a47"/>
      <stop offset="1" stop-color="#14506b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7dd3fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .flow { stroke-dasharray: 7 9; animation: flow 1.4s linear infinite; }
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes pulse { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .ring, .cursor { animation: none; } .ring { opacity: 0; } }
  </style>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#dots)" mask="url(#dotsMask)"/>
  <circle cx="1010" cy="250" r="230" fill="url(#glowTeal)"/>
  <circle cx="60" cy="40" r="170" fill="url(#glowTeal)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#7dd3fc" stroke-opacity="0.18"/>

  <!-- left: name, promise, chips -->
  <rect x="60" y="64" width="64" height="6" rx="3" fill="url(#accent)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="146" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1">spec-kit-ado</text>
    <text x="62" y="194" font-size="25" fill="#cfe0f2">You approve every change your AI agent</text>
    <text x="62" y="227" font-size="25" fill="#cfe0f2">makes to Azure DevOps.</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="62" y="258" width="150" height="32" rx="16" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.7"/>
      <text x="137" y="279" fill="#5eead4">A Spec Kit extension</text>
      <rect x="224" y="258" width="150" height="32" rx="16" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="299" y="279" fill="#fcd34d">Human-approved</text>
      <rect x="386" y="258" width="132" height="32" rx="16" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.7"/>
      <text x="452" y="279" fill="#93c5fd">Open source</text>
    </g>
  </g>

  <!-- right top: the moment you say yes -->
  <g filter="url(#shadow)">
    <rect x="760" y="34" width="384" height="118" rx="12" fill="#08111f" stroke="#2b567d"/>
  </g>
  <circle cx="780" cy="54" r="5" fill="#f87171"/>
  <circle cx="798" cy="54" r="5" fill="#fbbf24"/>
  <circle cx="816" cy="54" r="5" fill="#4ade80"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
    <text x="780" y="90" fill="#7dd3fc">&gt; /speckit.ado.push 1001</text>
    <text x="780" y="114" fill="#cfe0f2">Create 4 Tasks on the board?</text>
    <text x="780" y="138" fill="#9fb6cc">[</text>
    <text x="791" y="138" fill="#fbbf24" font-weight="700">y</text>
    <text x="800" y="138" fill="#9fb6cc">] yes   [n] no</text>
    <rect class="cursor" x="906" y="126" width="9" height="16" fill="#fbbf24"/>
  </g>

  <!-- right bottom: story, agent, you say yes, done -->
  <circle cx="1030" cy="236" r="62" fill="url(#glowAmber)"/>
  <g stroke="#7aa2c8" stroke-width="3" stroke-linecap="round">
    <line class="flow" x1="824" y1="236" x2="876" y2="236"/>
    <line class="flow" x1="944" y1="236" x2="990" y2="236"/>
    <line class="flow" x1="1070" y1="236" x2="1116" y2="236"/>
  </g>
  <path class="ring" d="M1030 202l34 34-34 34-34-34z" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#cfe0f2">
    <circle cx="794" cy="236" r="30" fill="#1d4f7a" stroke="#60a5fa" stroke-width="3"/>
    <path d="M781 224h26v24h-26z M787 232h14 M787 238h14 M787 244h8" fill="none" stroke="#e6f1fb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="794" y="292">Story</text>

    <circle cx="910" cy="236" r="30" fill="#1d4f7a" stroke="#5eead4" stroke-width="3"/>
    <path d="M910 218l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="none" stroke="#e6f1fb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="910" y="292">AI agent</text>

    <path d="M1030 202l34 34-34 34-34-34z" fill="#fbbf24" stroke="#fde68a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1018 237l9 9 17-19" fill="none" stroke="#3d2f00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1030" y="292" fill="#fde68a" font-weight="600">You say yes</text>

    <circle cx="1150" cy="236" r="30" fill="#14532d" stroke="#4ade80" stroke-width="3"/>
    <path d="M1138 237l9 9 17-19" fill="none" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1150" y="292">Done</text>
  </g>
</svg>
